spring.application.name=Employee Self-Service Portal
server.port=8080

# Database Configuration (persistent local H2 by default; override with environment variables)
spring.datasource.url=${DATABASE_URL:jdbc:h2:file:./data/essp_db;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driverClassName=${DATABASE_DRIVER:org.h2.Driver}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
app.seed-demo-data=${ESSP_SEED_DEMO_DATA:false}

# JWT secret should be supplied as Base64 in APP_JWT_SECRET. An ephemeral key is generated
# when omitted, which is convenient for local development but invalidates tokens on restart.
app.security.jwt.secret=${APP_JWT_SECRET:}
app.security.jwt.expiration-ms=86400000

# Rate Limiting configuration
app.security.rate-limit.login-capacity=5
app.security.rate-limit.login-refill-minutes=1

# Valid HR entitlement dropdown choices; the API enforces this same list.
app.leave.entitlement-options=0,5,10,12,15,18,20,24,30

# CORS configuration
app.security.cors.allowed-origins=http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:5173
