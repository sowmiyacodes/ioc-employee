spring.application.name=Employee Self-Service Portal
server.port=8080

# Database Configuration (H2 embedded for testing/self-contained runtime, supports PostgreSQL easily)
spring.datasource.url=jdbc:h2:mem:essp_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Security & JWT Secret (256-bit key for HMAC-SHA256)
app.security.jwt.secret=dGhpcy1pcy1hLXNlY3VyZS0yNTYtYml0LWtleS1mb3ItZXNzcG1lbWJlcjY0LXNlY3VyaXR5LXRlc3RpbmctcHVycG9zZXM=
app.security.jwt.expiration-ms=86400000

# Rate Limiting configuration
app.security.rate-limit.login-capacity=5
app.security.rate-limit.login-refill-minutes=1

# CORS configuration
app.security.cors.allowed-origins=http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:5173
